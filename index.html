<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMNI Pro — AI Studio</title>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #12121c;
    --panel: rgba(26, 26, 38, 0.85);
    --border: rgba(255, 255, 255, 0.12);
    --accent: #ff2f47;
    --text: #f3f3f7;
  }
  body {
    background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
    margin: 0; display: grid; grid-template-columns: 280px 1fr; height: 100vh;
  }
  aside, main { padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
  aside { border-right: 1px solid var(--border); background: rgba(0,0,0,0.2); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
  textarea {
    width: 100%; height: 100px; background: rgba(0,0,0,0.3); color: #fff;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; box-sizing: border-box; resize: none;
  }
  .btn-accent {
    background: var(--accent); color: #fff; border: none; padding: 12px;
    border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(255,47,71,0.4);
  }
  .output { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; flex: 1; overflow-y: auto; }
  .history-item { padding: 8px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; }
  .history-item:hover { color: var(--accent); }
</style>
</head>
<body>

<aside>
  <h2 style="color:var(--accent); margin:0;">OMNI PRO</h2>
  <button id="authBtn" class="btn-accent" style="background:#222; border:1px solid var(--border);">Sign In</button>
  <div class="card" style="flex:1; display:flex; flex-direction:column; gap:10px;">
    <h4 style="margin:0; color:var(--accent);">Saved Chats</h4>
    <div id="historyList" style="flex:1; overflow-y:auto; font-size:12px;">Login to sync chats.</div>
  </div>
</aside>

<main>
  <textarea id="prompt" placeholder="Ask anything... OMNI can write code, run Python code, or search the web!"></textarea>
  <button class="btn-accent" id="runBtn" disabled>Run OMNI ➔ (Login Required)</button>
  <div id="aiOutput" class="output">Please sign in to access your cloud workspace.</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js";

const firebaseConfig = {
  projectId: "omni-7dd23",
  apiKey: "YOUR_API_KEY", // Set your web API Key here
  authDomain: "omni-7dd23.firebaseapp.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ai = getAI(app, { backend: new GoogleAIBackend() });
const model = getGenerativeModel(ai, {
  model: "gemini-3.7-flash",
  tools: [{ codeExecution: {} }, { googleSearch: {} }]
});

let user = null;

document.getElementById('authBtn').onclick = () => user ? signOut(auth) : signInWithPopup(auth, new GoogleAuthProvider());

onAuthStateChanged(auth, u => {
  user = u;
  const authBtn = document.getElementById('authBtn');
  const runBtn = document.getElementById('runBtn');
  const historyList = document.getElementById('historyList');
  if (u) {
    authBtn.innerText = `Sign Out (${u.displayName.split(" ")[0]})`;
    runBtn.disabled = false;
    runBtn.innerText = "Run OMNI ➔";
    syncHistory(u.uid);
  } else {
    authBtn.innerText = "Sign In with Google";
    runBtn.disabled = true;
    runBtn.innerText = "Run OMNI ➔ (Login Required)";
    historyList.innerHTML = "Login to sync chats.";
    document.getElementById('aiOutput').innerText = "Please sign in to access your cloud workspace.";
  }
});

function syncHistory(uid) {
  const q = query(collection(db, "chats"), where("uid", "==", uid));
  onSnapshot(q, snapshot => {
    const list = document.getElementById('historyList');
    list.innerHTML = "";
    const docs = [];
    snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
    
    docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

    docs.forEach(data => {
      const div = document.createElement('div');
      div.className = "history-item";
      div.innerText = data.prompt.slice(0, 30) + "...";
      div.onclick = () => document.getElementById('aiOutput').innerHTML = DOMPurify.sanitize(marked.parse(data.response));
      list.appendChild(div);
    });
  });
}

window.runOmni = async () => {
  const prompt = document.getElementById('prompt').value.trim();
  const output = document.getElementById('aiOutput');
  if (!prompt || !user) return;

  if (firebaseConfig.apiKey === "YOUR_API_KEY") {
    output.innerHTML = "<span style='color:var(--accent)'>Error: Please replace YOUR_API_KEY inside the script config!</span>";
    return;
  }

  output.innerHTML = "<i>OMNI is thinking, executing, and retrieving...</i>";

  try {
    const result = await model.generateContent(prompt);
    const parts = result.response.candidates?.[0]?.content?.parts;
    let md = "";

    if (parts) {
      parts.forEach(part => {
        if (part.text) md += part.text;
        if (part.executableCode) md += `\n\n**Executing Code:**\n\`\`\`python\n${part.executableCode.code}\n\`\`\``;
        if (part.codeExecutionResult) md += `\n\n**Console Output:**\n\`\`\`\n${part.codeExecutionResult.output}\n\`\`\``;
      });
    }

    const responseText = md || "No response received.";
    output.innerHTML = DOMPurify.sanitize(marked.parse(responseText));
    
    await addDoc(collection(db, "chats"), {
      uid: user.uid,
      prompt,
      response: responseText,
      timestamp: serverTimestamp()
    });
  } catch (err) {
    output.innerHTML = `<span style="color:var(--accent)">Error: ${err.message}</span>`;
  }
};
document.getElementById('runBtn').onclick = window.runOmni;
</script>
</body>
</html>
