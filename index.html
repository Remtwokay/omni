<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMNI FINAL MERGED - DONE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:system-ui}
header{padding:12px;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{color:#a3ff12;font-weight:900;cursor:pointer}
.earn{border:2px solid #a3ff12;border-radius:12px;padding:6px 12px;cursor:pointer}
.earn b{color:#a3ff12}
.card{background:#14141c;border:1px solid #2a2a35;border-radius:14px;padding:14px;margin:12px}
.btn{background:#a3ff12;color:#000;border:0;padding:12px;border-radius:10px;font-weight:800;width:100%;cursor:pointer}
.btn2{background:#1a1a25;color:#fff;border:1px solid #333;padding:10px;border-radius:10px;cursor:pointer;width:100%;margin-top:6px}
input,textarea,select{width:100%;background:#0e0e14;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
video{width:100%;border-radius:12px;background:#000}
.prog{height:8px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}
.prog div{height:100%;background:#a3ff12;width:0%}
.sr{padding:10px;border-bottom:1px solid #222}
.sr a{color:#a3ff12;text-decoration:none}
</style>
</head>
<body>
<header>
<div class="logo" id="logoBtn">◫ OMNI FINAL</div>
<div class="earn" onclick="toggleHide()"><small>👁️ <span id="eye">Earnings</span></small><br><b id="tot">R0</b></div>
</header>

<div style="max-width:900px;margin:0 auto">
<div class="card">
<h3>🔍 Search REAL + PDF R5</h3>
<div style="display:flex;gap:8px"><input id="q" placeholder="Search anything"><button class="btn" style="width:auto;padding:12px 18px" onclick="doSearch()">GO</button></div>
<div id="searchOut" style="max-height:350px;overflow:auto;margin-top:8px;background:#0a0a10;border-radius:10px"></div>
<textarea id="ans" style="height:110px;margin-top:8px" placeholder="Results editable"></textarea>
<button class="btn" onclick="savePDF(true)">📄 PDF FREE with OMNI Logo</button>
<button class="btn2" onclick="savePDF(false)">📄 PDF Clean R5</button>
</div>

<div class="card">
<h3>📸 Camera Flip Fixed + Photo R10</h3>
<video id="vid" autoplay playsinline muted></video>
<div style="display:flex;gap:6px;margin-top:8px">
<button class="btn2" style="flex:1" onclick="startCam()">Start</button>
<button class="btn2" style="flex:1" onclick="flipCam()">🔄 Flip Front/Back</button>
<button class="btn2" style="flex:1" onclick="takePic()">Photo</button>
</div>
<canvas id="can" style="display:none"></canvas>
<div id="pics" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
</div>

<div class="card">
<h3>🎬 Video R10</h3>
<input id="vidP" placeholder="Video idea e.g. Ennerdale hustle">
<select id="vidM"><option value="5">5 min FREE with logo</option><option value="10" selected>10 min FREE with logo</option><option value="20">20 min Clean R10</option><option value="30">30 min Clean R10</option></select>
<button class="btn" onclick="makeVideo()">Create Video</button>
<canvas id="vCan" width="640" height="360" style="display:none"></canvas>
<div id="vidRes" style="margin-top:8px"></div>
</div>

<div class="card">
<h3>🎵 Music 4-7 MIN based on PROMPT + Track R100</h3>
<input id="songTitle" placeholder="Title">
<select id="genre"><option value="amapiano" selected>Amapiano</option><option value="afrobeat">Afrobeat</option><option value="hiphop">HipHop</option><option value="house">House</option></select>
<textarea id="prompt" rows="4" placeholder="e.g. Make a 7 minute amapiano love song about Ennerdale, verse about hustle, chorus about hope. Longer prompt = longer song 4-7 min"></textarea>
<div style="display:flex;gap:8px;align-items:center">
<input type="range" id="durRange" min="60" max="420" value="240" oninput="document.getElementById('durLabel').textContent=Math.floor(this.value/60)+'m '+this.value%60+'s'">
<span id="durLabel" style="color:#a3ff12;font-size:12px;white-space:nowrap">4m 0s</span>
</div>
<button class="btn" onclick="makeMusicFinal()">🎹 CREATE 4-7 MIN SONG</button>
<div class="prog"><div id="prog"></div></div>
<audio id="player" controls style="width:100%;margin-top:8px;display:none"></audio>
<button class="btn" id="freeDl" style="display:none;margin-top:6px">⬇️ FREE Download WITH OMNI Tag</button>
<button class="btn2" id="cleanDl" style="display:none">💎 Clean Track R100 No Tag</button>
<div id="mStatus" style="font-size:12px;color:#a3ff12;margin-top:6px"></div>
</div>

<div class="card">
<div id="ownerPanel" style="display:none">
<h3 style="color:#a3ff12">👑 Owner Panel</h3>
<input id="ownerCode" placeholder="Enter OMNI2026">
<button class="btn" onclick="beOwner()">Activate FREE Owner</button>
<div id="ownerStatus" style="color:#a3ff12;margin-top:6px"></div>
</div>
<p id="ownTxt" style="font-size:12px;color:#888">Status: Normal User - Tap logo 5x for owner</p>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
let facing='user',stream=null,audioCtx=null,sources=[],isOwner=localStorage.getItem('omni_owner')==='yes',total=parseInt(localStorage.getItem('omni_earn')||'0'),isHidden=false;
document.getElementById('tot').textContent='R'+total;
if(isOwner)document.getElementById('ownTxt').textContent='👑 OWNER - ALL FREE';
let taps=0;document.getElementById('logoBtn').onclick=()=>{taps++;if(taps>=5){document.getElementById('ownerPanel').style.display='block';taps=0;}};
function beOwner(){if(document.getElementById('ownerCode').value==='OMNI2026'){localStorage.setItem('omni_owner','yes');isOwner=true;document.getElementById('ownerStatus').textContent='OWNER ACTIVE';document.getElementById('ownTxt').textContent='👑 OWNER FREE MODE';alert('Owner active');}else alert('Wrong code');}
function addEarn(a){if(isOwner)return true;total+=a;localStorage.setItem('omni_earn',total);document.getElementById('tot').textContent='R'+total;return true;}
function toggleHide(){isHidden=!isHidden;document.getElementById('tot').style.filter=isHidden?'blur(8px)':'';document.getElementById('eye').textContent=isHidden?'🙈':'Earnings';}
async function doSearch(){const q=document.getElementById('q').value.trim(),out=document.getElementById('searchOut');if(!q)return;out.innerHTML='<p style=padding:10px>Searching...</p>';try{const w=await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=8&origin=*`).then(r=>r.json());let h='';w[1].forEach((t,i)=>h+=`<div class=sr><a href="${w[3][i]}" target=_blank>${t}</a><div style=font-size:12px;color:#aaa>${w[2][i]||''}</div></div>`);out.innerHTML=h||'No result';document.getElementById('ans').value=w[2].join('\n\n')||q;}catch(e){out.innerHTML='Error';}}
function savePDF(withLogo){let txt=document.getElementById('ans').value;const {jsPDF}=window.jspdf;let doc=new jsPDF();let lines=doc.splitTextToSize(txt,180);if(withLogo){doc.setTextColor(140,255,0);doc.text('OMNI - FREE',10,10);doc.setTextColor(0,0,0);doc.text(lines,10,20);doc.save('OMNI_FREE.pdf');}else{if(!isOwner&&!confirm('Pay R5 for clean PDF?'))return;addEarn(5);doc.text(lines,10,10);doc.save('OMNI_CLEAN_R5.pdf');}}
async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});document.getElementById('vid').srcObject=stream;}catch(e){alert(e.message);}}
function flipCam(){facing=facing==='user'?'environment':'user';startCam();}
function takePic(){const v=document.getElementById('vid'),c=document.getElementById('can');c.width=v.videoWidth||640;c.height=v.videoHeight||480;const ctx=c.getContext('2d');ctx.drawImage(v,0,0);let useLogo=confirm('OK=FREE with logo, Cancel=Clean R10');if(useLogo){ctx.fillStyle='#a3ff12';ctx.fillRect(0,0,90,24);ctx.fillStyle='#000';ctx.font='bold 12px Arial';ctx.fillText('OMNI',10,16);}else{if(!isOwner&&!confirm('Pay R10 clean?'))return;addEarn(10);}const url=c.toDataURL();const img=document.createElement('img');img.src=url;img.style.width='90px';img.style.borderRadius='8px';document.getElementById('pics').appendChild(img);}
function makeVideo(){let p=document.getElementById('vidP').value||'OMNI';let mins=parseInt(document.getElementById('vidM').value);let canvas=document.getElementById('vCan'),ctx=canvas.getContext('2d');let stream=canvas.captureStream(30);let rec=new MediaRecorder(stream);let chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});let url=URL.createObjectURL(blob);let isFree=mins<=10;if(!isFree){if(!isOwner&&!confirm('Pay R10 for '+mins+'min clean?'))return;addEarn(10);}document.getElementById('vidRes').innerHTML=`<video src="${url}" controls></video><p>${mins}min ${isFree?'FREE with logo':'Clean R10'} - <a href="${url}" download="OMNI_${mins}min.webm" style=color:#a3ff12>Download</a></p>`;};rec.start();let cnt=0;let inter=setInterval(()=>{ctx.fillStyle='#111';ctx.fillRect(0,0,640,360);ctx.fillStyle='#a3ff12';ctx.fillRect(0,0,90,30);ctx.fillStyle='#000';ctx.font='bold 12px Arial';ctx.fillText('OMNI',10,19);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText(p.slice(0,30),110,180);cnt++;if(cnt>=mins*6){clearInterval(inter);rec.stop();}},500);}
function getDur(pr){pr=pr.toLowerCase();if(pr.includes('7 min'))return 420;if(pr.includes('6 min'))return 360;if(pr.includes('5 min'))return 300;if(pr.includes('4 min'))return 240;const w=pr.split(/\s+/).length;if(w>80)return 420;if(w>50)return 360;if(w>25)return 300;return parseInt(document.getElementById('durRange').value)||240;}
function makeMusicFinal(){const prompt=document.getElementById('prompt').value,title=document.getElementById('songTitle').value||'Song',genre=document.getElementById('genre').value;let dur=getDur(prompt);document.getElementById('durRange').value=dur;document.getElementById('durLabel').textContent=Math.floor(dur/60)+'m '+dur%60+'s';document.getElementById('mStatus').textContent='Creating '+Math.floor(dur/60)+'m...';document.getElementById('prog').style.width='20%';if(sources.length)sources.forEach(s=>{try{s.stop()}catch(e){}});if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const sr=audioCtx.sampleRate,buf=audioCtx.createBuffer(2,sr*dur,sr),bpm=genre==='amapiano'?113:104,beat=60/bpm;for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<sr*dur;i++){const t=i/sr,sec=t/dur,beatPos=t%beat,barPos=t%(beat*4);let s=0;let e=sec<0.08?sec/0.08:sec>0.92?(1-sec)/0.08:1;if(beatPos<0.13)s+=Math.sin(2*Math.PI*50*t)*Math.exp(-beatPos*16)*1.2*e;if((barPos>beat-0.03&&barPos<beat+0.1)||(barPos>beat*3-0.03&&barPos<beat*3+0.1))if(beatPos<0.15)s+=(Math.random()*2-1)*0.3*e;let bf=[50,63,68,60][Math.floor(barPos/beat)%4];if(genre==='amapiano')bf-=7;s+=Math.sin(2*Math.PI*bf*t)*0.45*e;const scale=sec>0.5?[0,3,5,7,10]:[0,2,4,7,9];const note=scale[Math.floor(t*2)%scale.length];const f=220*Math.pow(2,note/12)*(ch?1.007:1);s+=Math.sin(2*Math.PI*f*t)*0.14*Math.exp(-(t%0.5)*1.2)*e;d[i]=s*0.5;}}document.getElementById('prog').style.width='100%';const blob=wavBlob(buf),url=URL.createObjectURL(blob),pl=document.getElementById('player');pl.src=url;pl.style.display='block';document.getElementById('freeDl').style.display='block';document.getElementById('cleanDl').style.display='block';document.getElementById('freeDl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=title+'_FREE_WITH_TAG.wav';a.click();};document.getElementById('cleanDl').onclick=()=>{if(!isOwner&&!confirm('Pay R100 clean?'))return;addEarn(100);const a=document.createElement('a');a.href=url;a.download=title+'_CLEAN_R100.wav';a.click();};document.getElementById('mStatus').textContent='✅ '+Math.floor(dur/60)+'m '+dur%60+'s DONE';const src=audioCtx.createBufferSource();src.buffer=buf;src.connect(audioCtx.destination);src.start();sources=[src];}
function wavBlob(b){const n=b.numberOfChannels,l=b.length*n*2+44,ab=new ArrayBuffer(l),v=new DataView(ab);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,l-8,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,n,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*n*2,true);v.setUint16(32,n*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,l-44,true);let o=44;for(let i=0;i<b.length;i++)for(let c=0;c<n;c++){let s=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true);o+=2;}return new Blob([ab],{type:'audio/wav'});}
</script>
</body>
</html>
