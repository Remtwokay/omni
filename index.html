<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMNI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #c4001a;
  --bg-deep: #8f0014;
  --ink: #5c000d;
  --line: rgba(255,255,255,.22);
  --text: #ffffff;
  --muted: #ffd5d9;
  --card: #ffffff;
  --dark: #1a0507;
  --nav-h: calc(62px + env(safe-area-inset-bottom, 0px));
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 10% -20%,#ff3b55 0,transparent 40%),var(--bg);
  color:var(--text);min-height:100vh;padding-bottom:var(--nav-h);
}
button,input,textarea{font:inherit}button{cursor:pointer}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(143,0,20,.92);backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:1.5px;font-size:18px}
.brand span{width:28px;height:28px;background:#fff;color:var(--bg);border-radius:8px;display:grid;place-items:center;font-weight:900}

.shell{max-width:820px;margin:0 auto;padding:16px}

/* Search */
.search-box{background:#fff;border-radius:18px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.25);margin-bottom:16px}
#mainInput{width:100%;border:0;outline:0;padding:12px 14px;font-size:16px;font-weight:600;color:var(--dark);resize:none;min-height:48px}
.search-actions{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;border-top:1px solid #f0d0d0}
.go{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:800}

/* Trending */
.trending{margin-bottom:18px}
.trending h3{font-size:13px;font-weight:800;margin-bottom:10px;opacity:.9}
.trend-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.trend{background:rgba(0,0,0,.22);border:none;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px;white-space:nowrap;font-weight:600}

/* Cards */
.card{background:var(--card);color:var(--dark);border-radius:16px;padding:16px;margin-bottom:12px}
.card .label{font-size:11px;font-weight:900;color:var(--bg);letter-spacing:.3px}
.answer{line-height:1.6;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.action{background:#fff0f0;border:1px solid #f0d0d0;color:var(--ink);padding:6px 11px;border-radius:10px;font-size:12px;font-weight:700}

/* Chat */
.chat-thread{display:flex;flex-direction:column;gap:10px;min-height:50vh;padding-bottom:12px}
.bubble{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.bubble.user{align-self:flex-end;background:#fff;color:var(--dark)}
.bubble.bot{align-self:flex-start;background:rgba(255,255,255,.14);border:1px solid var(--line)}
.composer{position:fixed;left:0;right:0;bottom:var(--nav-h);background:rgba(143,0,20,.95);backdrop-filter:blur(10px);padding:10px 14px;display:flex;gap:8px;border-top:1px solid var(--line);z-index:30}
.composer textarea{flex:1;border:0;border-radius:14px;padding:10px 12px;min-height:42px;max-height:100px;resize:none}
.send{background:#fff;color:var(--bg);border:0;border-radius:14px;padding:10px 14px;font-weight:900}

/* Camera */
.cam-wrap{position:relative;max-width:480px;margin:0 auto}
#camVideo{width:100%;border-radius:14px;background:#000;display:block}
.filters{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.fbtn{background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.fbtn.active{background:#fff;color:var(--bg)}
.cam-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* Creative */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{background:rgba(255,255,255,.12);border-radius:14px;overflow:hidden}
.item img{width:100%;height:120px;object-fit:cover;display:block}
.item .info{padding:8px;font-size:12px}

/* Bottom Nav */
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(143,0,20,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50}
.nav{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;padding:4px 8px;border-radius:10px;opacity:.7}
.nav.active{opacity:1;background:rgba(255,255,255,.18)}
.nav .ico{font-size:18px}

.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px}
.profile-card{background:#fff;color:var(--dark);border-radius:16px;padding:16px;margin-bottom:12px}
.profile-card h3{font-size:15px;margin-bottom:10px;color:var(--ink)}
.profile-card input,.profile-card textarea{width:100%;border:1px solid #f0c9c9;background:#fff5f5;border-radius:8px;padding:9px 10px;color:var(--dark);margin-bottom:8px}
.save{width:100%;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:800;margin-top:6px}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span>O</span> OMNI</div>
  <button id="newBtn" style="background:rgba(255,255,255,.15);border:1px solid var(--line);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700">+ New</button>
</div>

<div class="shell">

  <!-- HOME -->
  <section id="homeView">
    <div class="search-box">
      <textarea id="mainInput" placeholder="Ask OMNI anything or search..." rows="1"></textarea>
      <div class="search-actions">
        <span style="font-size:12px;color:#8a5a5f">AI + Search</span>
        <button class="go" id="goBtn">Go</button>
      </div>
    </div>

    <div class="trending">
      <h3>Trending & Important</h3>
      <div class="trend-list" id="trendList"></div>
    </div>

    <div id="homeResult"></div>
  </section>

  <!-- CHAT -->
  <section id="chatView" hidden>
    <div id="chatThread" class="chat-thread">
      <div class="empty">Start a conversation with OMNI</div>
    </div>
  </section>

  <!-- CAMERA -->
  <section id="cameraView" hidden>
    <div class="card" style="background:transparent;border:0;padding:0">
      <div class="cam-wrap">
        <video id="camVideo" autoplay playsinline muted></video>
      </div>
      <div class="filters" id="filters">
        <button class="fbtn active" data-f="none">Normal</button>
        <button class="fbtn" data-f="grayscale(100%)">B&W</button>
        <button class="fbtn" data-f="sepia(80%)">Sepia</button>
        <button class="fbtn" data-f="contrast(1.2) brightness(1.1)">Vivid</button>
        <button class="fbtn" data-f="hue-rotate(160deg)">Neon</button>
      </div>
      <div class="cam-btns">
        <button class="go" id="startCam">Start Camera</button>
        <button class="action" id="flipCam" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid var(--line)">Flip</button>
        <button class="action" id="captureCam" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid var(--line)">Capture</button>
        <button class="action" id="stopCam" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid var(--line)" hidden>Stop</button>
      </div>
      <div id="camStatus" style="text-align:center;margin-top:10px;font-size:13px;color:var(--muted)"></div>
    </div>
  </section>

  <!-- CREATIVE -->
  <section id="creativeView" hidden>
    <div class="card">
      <div class="label">IMAGE GENERATION</div>
      <input id="imgPrompt" placeholder="Describe an image..." style="width:100%;margin:10px 0;padding:10px;border-radius:10px;border:1px solid #f0c9c9">
      <button class="go" id="genImg">Generate</button>
    </div>
    <div class="grid" id="imgGrid"></div>
  </section>

  <!-- SETTINGS -->
  <section id="settingsView" hidden>
    <div class="profile-card">
      <h3>Groq API Key</h3>
      <input type="password" id="apiKey" placeholder="gsk_...">
      <button class="save" id="saveKey">Save Key</button>
      <p style="font-size:12px;color:#8a5a5f;margin-top:8px">Get a free key at console.groq.com</p>
    </div>
    <div class="profile-card">
      <h3>System Style</h3>
      <textarea id="sysPrompt" rows="3">You are OMNI, a helpful, clear and capable AI assistant.</textarea>
      <button class="save" id="savePrompt">Save</button>
    </div>
    <div class="profile-card">
      <button class="save" id="clearAll" style="background:#b91c1c">Clear All Data</button>
    </div>
  </section>
</div>

<!-- Chat Composer -->
<div class="composer" id="composer" hidden>
  <textarea id="chatInput" placeholder="Message OMNI..." rows="1"></textarea>
  <button class="send" id="chatSend">Send</button>
</div>

<!-- Bottom Nav -->
<nav class="bottom">
  <button class="nav active" data-v="home"><span class="ico">🏠</span>Home</button>
  <button class="nav" data-v="chat"><span class="ico">💬</span>Chat</button>
  <button class="nav" data-v="camera"><span class="ico">📷</span>Camera</button>
  <button class="nav" data-v="creative"><span class="ico">🎨</span>Creative</button>
  <button class="nav" data-v="settings"><span class="ico">⚙️</span>Settings</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const state = {
  key: localStorage.getItem("omni_key") || "",
  prompt: localStorage.getItem("omni_prompt") || "You are OMNI, a helpful, clear and capable AI assistant. Be direct and useful.",
  chats: JSON.parse(localStorage.getItem("omni_chats") || "[]"),
  current: null,
  images: JSON.parse(localStorage.getItem("omni_images") || "[]"),
  camStream: null,
  facing: "user",
  filter: "none"
};

function save() {
  localStorage.setItem("omni_chats", JSON.stringify(state.chats));
  localStorage.setItem("omni_images", JSON.stringify(state.images));
  localStorage.setItem("omni_key", state.key);
  localStorage.setItem("omni_prompt", state.prompt);
}

function uid(){ return Date.now() + "_" + Math.random().toString(36).slice(2,6); }

function setView(v){
  ["home","chat","camera","creative","settings"].forEach(x => {
    $(`#${x}View`).hidden = x !== v;
  });
  $("#composer").hidden = v !== "chat";
  $$(".nav").forEach(n => n.classList.toggle("active", n.dataset.v === v));
  if(v === "chat") renderChat();
  if(v === "creative") renderImages();
  if(v === "camera" && !state.camStream) {}
  if(v !== "camera") stopCam();
}

$$(".nav").forEach(n => n.onclick = () => setView(n.dataset.v));

// Trending (simple static + live feel)
const trends = [
  "Global climate updates",
  "AI regulation news",
  "Space exploration",
  "Health breakthroughs",
  "Economic shifts",
  "Tech innovation",
  "Sports highlights",
  "Science discoveries"
];
$("#trendList").innerHTML = trends.map(t => 
  `<button class="trend" onclick="runQuery('${t}')">${t}</button>`
).join("");

window.runQuery = (q) => {
  $("#mainInput").value = q;
  doMain();
};

// Main Search / AI
$("#goBtn").onclick = doMain;
$("#mainInput").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doMain(); }
});

async function doMain(){
  const q = $("#mainInput").value.trim();
  if(!q) return;

  $("#homeResult").innerHTML = `<div class="card"><div class="label">WORKING</div><div style="margin-top:8px">Thinking...</div></div>`;

  // Simple tool detection
  if(/calculate|what is \d|math/i.test(q)){
    const expr = q.replace(/[^0-9+\-*/().\s]/g,"");
    try{
      const res = Function(`"use strict";return (${expr})`)();
      $("#homeResult").innerHTML = `<div class="card"><div class="label">RESULT</div><div class="answer" style="font-size:22px;font-weight:800">${res}</div></div>`;
      return;
    }catch{}
  }

  // Search sources
  let context = "";
  try{
    const wiki = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`).then(r=>r.ok?r.json():null).catch(()=>null);
    if(wiki?.extract) context += wiki.extract + "\n\n";
  }catch{}

  if(state.key){
    const answer = await askAI(q, context);
    $("#homeResult").innerHTML = `
      <div class="card">
        <div class="label">OMNI</div>
        <div class="answer">${marked.parse(answer || "No response")}</div>
        <div class="actions">
          <button class="action" onclick="navigator.clipboard.writeText(\`${(answer||"").replace(/`/g,"")}\`)">Copy</button>
        </div>
      </div>`;
  } else {
    $("#homeResult").innerHTML = `
      <div class="card">
        <div class="label">RESULT</div>
        <div class="answer">${context ? context.slice(0,600)+"..." : "Add your free Groq API key in Settings for full AI answers."}</div>
      </div>`;
  }
}

async function askAI(user, context=""){
  if(!state.key) return null;
  try{
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${state.key}`
      },
      body:JSON.stringify({
        model:"llama-3.3-70b-versatile",
        messages:[
          {role:"system",content:state.prompt},
          {role:"user",content: context ? `Context:\n${context}\n\nQuestion: ${user}` : user}
        ],
        temperature:0.6,
        max_tokens:1024
      })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || null;
  }catch{ return null; }
}

// Chat
function newChat(){
  const id = uid();
  state.chats.unshift({id, title:"New Chat", messages:[]});
  state.current = id;
  save();
  setView("chat");
  renderChat();
}
$("#newBtn").onclick = newChat;

function renderChat(){
  const chat = state.chats.find(c => c.id === state.current);
  if(!chat){ newChat(); return; }
  const thread = $("#chatThread");
  if(chat.messages.length === 0){
    thread.innerHTML = `<div class="empty">Start chatting with OMNI</div>`;
    return;
  }
  thread.innerHTML = chat.messages.map(m => 
    `<div class="bubble ${m.role==="user"?"user":"bot"}">${marked.parse(m.content||"")}</div>`
  ).join("");
  thread.scrollTop = thread.scrollHeight;
}

$("#chatSend").onclick = sendChat;
$("#chatInput").addEventListener("keydown", e => {
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); }
});

async function sendChat(){
  const text = $("#chatInput").value.trim();
  if(!text) return;
  const chat = state.chats.find(c => c.id === state.current);
  if(!chat) return;

  chat.messages.push({role:"user", content:text});
  if(chat.title==="New Chat") chat.title = text.slice(0,40);
  $("#chatInput").value = "";
  save(); renderChat();

  if(!state.key){
    chat.messages.push({role:"assistant", content:"Please add your Groq API key in Settings."});
    save(); renderChat(); return;
  }

  const reply = await askAI(text);
  chat.messages.push({role:"assistant", content: reply || "No response"});
  save(); renderChat();
}

// Camera
$("#startCam").onclick = async () => {
  if(!window.isSecureContext) return $("#camStatus").textContent = "Needs HTTPS or localhost";
  try{
    state.camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing}});
    $("#camVideo").srcObject = state.camStream;
    $("#stopCam").hidden = false;
    $("#camStatus").textContent = "Camera active";
  }catch{ $("#camStatus").textContent = "Camera permission denied"; }
};
$("#stopCam").onclick = stopCam;
function stopCam(){
  state.camStream?.getTracks().forEach(t=>t.stop());
  state.camStream = null;
  $("#stopCam").hidden = true;
  $("#camStatus").textContent = "";
}
$("#flipCam").onclick = () => {
  state.facing = state.facing==="user" ? "environment" : "user";
  if(state.camStream){ stopCam(); setTimeout(()=>$(" #startCam").click(), 300); }
};
$$(".fbtn").forEach(b => b.onclick = () => {
  $$(".fbtn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  state.filter = b.dataset.f;
  $("#camVideo").style.filter = state.filter==="none" ? "none" : state.filter;
});
$("#captureCam").onclick = () => {
  const v = $("#camVideo");
  const c = document.createElement("canvas");
  c.width = v.videoWidth||640; c.height = v.videoHeight||480;
  const ctx = c.getContext("2d");
  ctx.filter = state.filter==="none"?"none":state.filter;
  ctx.drawImage(v,0,0);
  const url = c.toDataURL("image/jpeg",0.9);
  state.images.unshift({url, title:"Capture "+new Date().toLocaleTimeString()});
  save();
  const a = document.createElement("a");
  a.href = url; a.download = "omni-capture.jpg"; a.click();
};

// Creative
$("#genImg").onclick = () => {
  const p = $("#imgPrompt").value.trim();
  if(!p) return;
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=768&height=768&nologo=true`;
  state.images.unshift({url, title:p.slice(0,30)});
  save();
  renderImages();
};
function renderImages(){
  $("#imgGrid").innerHTML = state.images.map(img => `
    <div class="item">
      <img src="${img.url}" alt="">
      <div class="info">${img.title}</div>
      <button class="action" style="margin:6px;width:calc(100% - 12px)" onclick="downloadImg('${img.url}')">Download</button>
    </div>`).join("") || `<div class="empty">No images yet</div>`;
}
window.downloadImg = (url) => {
  const a = document.createElement("a");
  a.href = url; a.download = "omni-image.jpg"; a.target = "_blank"; a.click();
};

// Settings
$("#apiKey").value = state.key;
$("#sysPrompt").value = state.prompt;
$("#saveKey").onclick = () => {
  state.key = $("#apiKey").value.trim();
  save();
  alert("Key saved");
};
$("#savePrompt").onclick = () => {
  state.prompt = $("#sysPrompt").value.trim() || state.prompt;
  save();
  alert("Saved");
};
$("#clearAll").onclick = () => {
  if(confirm("Clear everything?")){ localStorage.clear(); location.reload(); }
};

// Init
if(state.chats.length === 0) newChat();
else state.current = state.chats[0].id;
setView("home");
</script>
</body>
</html>
