<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNI Beast - AI Engine & Multi-Source Agent</title>
<style>
:root {
  --red: #E10600;
  --dark-red: #8B0000;
  --dark-bg: #0d0202;
  --card-bg: rgba(255, 255, 255, 0.12);
  --panel-bg: #180505;
  --panel-border: rgba(255, 255, 255, 0.2);
  --text: #ffffff;
  --muted: #e0b0b0;
  --cyan: #67e8f9;
  --green: #55e6a5;
  --amber: #ffd166;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { background: var(--red); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

header { padding: 24px 20px 12px; text-align: center; }
.logo { font-size: 42px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
.tagline { opacity: 0.9; margin-top: 4px; font-size: 14px; font-weight: 500; }

.main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Search Bar */
.search-wrap { max-width: 750px; margin: 10px auto 0; }
.search-form { display: flex; gap: 8px; }
.search-bar { 
  flex: 1; background: white; color: #111; border: none; border-radius: 18px; 
  padding: 18px 22px; font-size: 17px; outline: none; box-shadow: 0 10px 30px rgba(0,0,0,.3); 
}
.search-bar::placeholder { color: #777; }
.btn-submit { 
  background: var(--dark-red); color: white; border: 1px solid rgba(255,255,255,0.3); 
  padding: 0 24px; border-radius: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; 
}
.btn-submit:hover { background: #000; }

/* Mode Selection Bar */
.mode-bar { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0; scrollbar-width: none; }
.mode-bar::-webkit-scrollbar { display: none; }
.mode-bar button { 
  background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255,255,255,0.3); color: white; 
  padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.2s;
}
.mode-bar button.active { background: white; color: var(--red); font-weight: 800; border-color: white; }

/* Quick Control Toggles */
.controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
.toggles { display: flex; gap: 8px; }
.toggle-btn { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.25); color: white; border-radius: 12px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
.toggle-btn.on { background: white; color: var(--dark-red); font-weight: bold; }
.status-text { font-size: 13px; opacity: 0.95; }

/* Agent Execution Plan */
.plan-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 14px; margin-bottom: 16px; display: none; }
.plan-panel.show { display: block; }
.plan-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.steps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.step-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; font-size: 12px; }
.step-card.active { border-color: var(--cyan); background: rgba(103, 232, 249, 0.1); }
.step-card.done { border-color: var(--green); opacity: 0.8; }
.step-num { font-size: 10px; color: var(--cyan); }

/* Main Output Box */
#answer { 
  background: white; color: #111; border-radius: 18px; padding: 24px; 
  display: none; white-space: pre-wrap; line-height: 1.65; box-shadow: 0 15px 35px rgba(0,0,0,0.4); margin-bottom: 20px;
}
#answer.show { display: block; }
.cite-tag { color: var(--red); font-weight: 700; cursor: pointer; }

/* Evidence Sources Grid */
.sources-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 18px; padding: 18px; margin-bottom: 20px; display: none; }
.sources-panel.show { display: block; }
.source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 10px; }
.source-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px; font-size: 12px; }
.source-card h4 { font-size: 13px; color: #fff; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-card p { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
.source-card a { color: var(--cyan); text-decoration: none; font-weight: bold; }

/* Tools Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
.card { 
  background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--panel-border); 
  border-radius: 16px; padding: 14px; cursor: pointer; transition: 0.2s; 
}
.card:hover { background: white; color: var(--red); transform: translateY(-3px); }
.card b { display: block; font-size: 14px; margin-bottom: 4px; }
.card small { opacity: 0.8; font-size: 11px; }

/* Modal Elements */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; place-items: center; padding: 20px; z-index: 100; }
.modal.open { display: grid; }
.modal-card { background: #150505; border: 1px solid var(--panel-border); border-radius: 20px; width: min(800px, 100%); padding: 20px; max-height: 90vh; overflow-y: auto; color: white; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.camera-wrap { background: #000; border-radius: 12px; overflow: hidden; position: relative; min-height: 240px; }
.camera-wrap video { width: 100%; max-height: 50vh; object-fit: contain; display: block; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-group button { padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; cursor: pointer; }
textarea.app-input { width: 100%; min-height: 80px; background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); color: white; border-radius: 10px; padding: 10px; margin-top: 10px; }

footer { text-align: center; padding: 20px; opacity: 0.8; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">OMNI BEAST</div>
  <p class="tagline">50 AI Tools • Grounded Agent Search • Vision Engine</p>
</header>

<div class="main-container">

  <!-- Search Area -->
  <div class="search-wrap">
    <form class="search-form" id="searchForm">
      <input id="q" class="search-bar" placeholder="Search anything... e.g. Quantum Computing updates or upload an image">
      <button type="submit" class="btn-submit">Execute</button>
    </form>
  </div>

  <!-- Mode Selector -->
  <div class="mode-bar" id="modes">
    <button class="active" data-mode="search">🔍 Search (Perplexity)</button>
    <button data-mode="chat">💬 Solve (Claude)</button>
    <button data-mode="write">✍️ Write (Gemini)</button>
    <button data-mode="code">💻 Code (Cursor)</button>
    <button data-mode="image">🎨 Image (Midjourney)</button>
    <button data-mode="video">🎬 Video (Kling)</button>
    <button data-mode="voice">🎙️ Voice (ElevenLabs)</button>
    <button data-mode="paper">📄 Papers (Elicit)</button>
  </div>

  <!-- Execution Controls -->
  <div class="controls-bar">
    <div class="toggles">
      <button class="toggle-btn" id="deepBtn">◈ Deep Search</button>
      <button class="toggle-btn" id="aiBtn">✦ Worker AI Stream</button>
      <button class="toggle-btn" id="cameraBtn">◉ Camera / OCR</button>
      <button class="toggle-btn" id="settingsBtn">⚙ Settings</button>
    </div>
    <div class="status-text" id="status">Status: Ready</div>
  </div>

  <!-- Agent Step Plan Execution -->
  <div class="plan-panel" id="planPanel">
    <div class="plan-title">Agent Execution Trace</div>
    <div class="steps-grid" id="stepsGrid"></div>
  </div>

  <!-- Final Answer Panel -->
  <div id="answer"></div>

  <!-- Retrieved Sources Grid -->
  <div class="sources-panel" id="sourcesPanel">
    <div class="plan-title">Grounded Evidence Sources (<span id="sourceCount">0</span>)</div>
    <div class="source-grid" id="sourceGrid"></div>
  </div>

  <!-- Available Tools Grid -->
  <div class="grid" id="grid"></div>

</div>

<!-- Camera/OCR Modal -->
<div class="modal" id="cameraModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Multimodal Vision Engine</h3>
      <button onclick="closeModal('cameraModal')">✕</button>
    </div>
    <div class="camera-wrap">
      <video id="cameraVideo" autoplay playsinline muted></video>
    </div>
    <div class="btn-group">
      <button id="startCamBtn">Start Camera</button>
      <button id="stopCamBtn">Stop Camera</button>
      <button id="ocrBtn">Run Browser OCR</button>
    </div>
    <div style="margin-top: 15px;">
      <input type="file" id="ocrFile" accept="image/*">
      <textarea id="ocrText" class="app-input" placeholder="OCR Output extracted locally will appear here..."></textarea>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>Worker Configuration</h3>
      <button onclick="closeModal('settingsModal')">✕</button>
    </div>
    <label style="display:block; margin-bottom:8px; font-size:13px;">Cloudflare Worker API URL:</label>
    <input id="workerUrlInput" style="width:100%; padding:10px; border-radius:8px; border:1px solid #444; background:#222; color:#fff;" placeholder="https://YOUR-WORKER.workers.dev">
    <div class="btn-group" style="margin-top:15px;">
      <button id="saveSettingsBtn" style="background:var(--red);">Save Settings</button>
    </div>
  </div>
</div>

<footer>OMNI Beast 5.0 • Powered by Grounded Search Agent Architecture</footer>

<script>
// === TOOL REGISTRY CONFIGURATION ===
const TOOLS = [
  {n:"Claude",d:"Solve complex problems step-by-step",m:"chat",icon:"🧠"},
  {n:"Perplexity",d:"Research with live sources",m:"search",icon:"🔍"},
  {n:"Cursor",d:"AI code synthesis & bug fixing",m:"code",icon:"⌨️"},
  {n:"Gemini",d:"Advanced writing & rewriting",m:"write",icon:"✍️"},
  {n:"Midjourney",d:"Generate structured image prompts",m:"image",icon:"🖼️"},
  {n:"Kling AI",d:"Create video prompts",m:"video",icon:"🎬"},
  {n:"ElevenLabs",d:"Design voiceover scripts",m:"voice",icon:"🗣️"},
  {n:"Elicit",d:"Analyze research papers",m:"paper",icon:"📑"},
  {n:"ChatGPT",d:"Brainstorm ideas and workflows",m:"chat",icon:"💡"},
  {n:"NotebookLM",d:"Analyze documents",m:"paper",icon:"📓"},
  {n:"Bolt.new",d:"Full-stack web developer",m:"code",icon:"⚡"},
  {n:"Runway",d:"Cinematic video editing prompts",m:"video",icon:"🎞️"},
  {n:"Suno",d:"Generate music composition ideas",m:"voice",icon:"🎵"},
  {n:"DeepL",d:"Translate text accurately",m:"write",icon:"🌍"},
  {n:"Grok",d:"Realtime updates & analysis",m:"search",icon:"🚀"},
  {n:"Notion AI",d:"Write and organize notes",m:"write",icon:"🗒️"}
];

// === APPLICATION STATE ===
const state = {
  currentMode: "search",
  deepMode: false,
  aiStreaming: false,
  workerUrl: localStorage.getItem('omni_worker_url') || "https://YOUR-WORKER.workers.dev",
  evidence: [],
  cameraStream: null
};

const STEPS = ['Understand', 'Plan', 'Fetch Evidence', 'Verify Evidence', 'Synthesize'];

// === DOM ELEMENTS ===
const grid = document.getElementById('grid');
const answerBox = document.getElementById('answer');
const input = document.getElementById('q');
const statusText = document.getElementById('status');
const planPanel = document.getElementById('planPanel');
const stepsGrid = document.getElementById('stepsGrid');
const sourcesPanel = document.getElementById('sourcesPanel');
const sourceGrid = document.getElementById('sourceGrid');

// === UI RENDER FUNCTIONS ===
function renderTools(filter = state.currentMode) {
  grid.innerHTML = '';
  TOOLS.filter(t => filter === 'all' || t.m === filter).forEach(t => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<b>${t.icon} ${t.n}</b><small>${t.d}</small>`;
    div.onclick = () => {
      input.value = t.d + ": ";
      input.focus();
      state.currentMode = t.m;
      updateActiveModeUI();
    };
    grid.appendChild(div);
  });
}

function updateActiveModeUI() {
  document.querySelectorAll('.mode-bar button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.currentMode);
  });
  renderTools();
}

function setStepUI(stepIndex) {
  planPanel.classList.add('show');
  stepsGrid.innerHTML = STEPS.map((s, i) => `
    <div class="step-card ${i < stepIndex ? 'done' : ''} ${i === stepIndex ? 'active' : ''}">
      <div class="step-num">STEP 0${i+1}</div>
      <div>${s}</div>
    </div>
  `).join('');
}

// === MULTI-SOURCE SEARCH ENGINE ===
async function fetchGroundedSources(query) {
  const sources = [];
  
  // Adapter 1: Wikipedia API
  try {
    const wikiRes = await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=${state.deepMode ? 5 : 3}&origin=*`).then(r => r.json());
    if (wikiRes && wikiRes[1]) {
      wikiRes[1].forEach((title, i) => {
        sources.push({
          n: sources.length + 1,
          source: "Wikipedia",
          title: title,
          url: wikiRes[3][i] || "#",
          text: wikiRes[2][i] || "Public directory extract."
        });
      });
    }
  } catch (e) { console.warn("Wikipedia fetch skipped"); }

  // Adapter 2: Wikidata API
  try {
    const wdRes = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=en&format=json&origin=*`).then(r => r.json());
    if (wdRes && wdRes.search) {
      wdRes.search.slice(0, 2).forEach(item => {
        sources.push({
          n: sources.length + 1,
          source: "Wikidata",
          title: item.label || item.id,
          url: `https://www.wikidata.org/wiki/${item.id}`,
          text: item.description || "Structured knowledge base record."
        });
      });
    }
  } catch (e) { console.warn("Wikidata fetch skipped"); }

  // Adapter 3: Datamuse API (Word/Context Association)
  try {
    const dmRes = await fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(query)}&max=3`).then(r => r.json());
    if (Array.isArray(dmRes) && dmRes.length > 0) {
      sources.push({
        n: sources.length + 1,
        source: "Datamuse Context Engine",
        title: `Semantic terms for '${query}'`,
        url: "https://www.datamuse.com/",
        text: "Associated semantic context: " + dmRes.map(w => w.word).join(", ")
      });
    }
  } catch (e) { console.warn("Datamuse fetch skipped"); }

  // Fallback default source if external requests are constrained
  if (sources.length === 0) {
    sources.push({
      n: 1,
      source: "Query Context",
      title: "Direct Query Input",
      url: "#",
      text: query
    });
  }

  return sources;
}

function renderSourcesUI(sources) {
  sourcesPanel.classList.add('show');
  document.getElementById('sourceCount').textContent = sources.length;
  sourceGrid.innerHTML = sources.map(s => `
    <div class="source-card">
      <h4>[${s.n}] ${s.title}</h4>
      <p>${s.text}</p>
      <a href="${s.url}" target="_blank" rel="noopener">${s.source} ↗</a>
    </div>
  `).join('');
}

// === AGENT EXECUTION CONTROLLER ===
async function runOmni(question) {
  answerBox.className = 'show';
  answerBox.textContent = '⚡ Initializing OMNI Agent Execution...';
  
  // Step 1: Understand
  setStepUI(0);
  statusText.textContent = "Status: Analyzing query intent...";
  await new Promise(r => setTimeout(r, 200));

  // Step 2: Plan
  setStepUI(1);
  statusText.textContent = "Status: Formulating search graph...";
  await new Promise(r => setTimeout(r, 200));

  // Step 3: Fetch Evidence
  setStepUI(2);
  statusText.textContent = "Status: Fetching live evidence across APIs...";
  const evidence = await fetchGroundedSources(question);
  state.evidence = evidence;
  renderSourcesUI(evidence);

  // Step 4: Verify
  setStepUI(3);
  statusText.textContent = "Status: Verifying source integrity...";
  await new Promise(r => setTimeout(r, 200));

  // Step 5: Synthesize
  setStepUI(4);
  statusText.textContent = "Status: Synthesizing final output...";

  if (state.aiStreaming) {
    await streamWorkerAI(question, evidence);
  } else {
    synthesizeLocalResponse(question, evidence);
  }

  statusText.textContent = "Status: Execution Complete";
}

// Local Synthesis Fallback Engine
function synthesizeLocalResponse(question, evidence) {
  let output = `### OMNI Execution Result (${state.currentMode.toUpperCase()} Mode)\n\n`;
  output += `Query: "${question}"\n\n`;
  output += `Key Evidence Findings:\n`;

  evidence.forEach(s => {
    output += `• **${s.title}** (${s.source}): ${s.text}\n`;
  });

  output += `\nSynthesis Summary:\n`;
  output += `Based on retrieved evidence, the search query relates to identified context terms across public indexes. Enable 'Worker AI Stream' in toggles to pipe this evidence through an active backend LLM.`;

  answerBox.innerHTML = output.replace(/\/g, '<span class="cite-tag">[Source $1]</span>');
}

// Cloudflare Worker Streaming Connector
async function streamWorkerAI(question, evidence) {
  const modePrompts = {
    search: `You are Perplexity. Research thoroughly. Cite evidence using [n].`,
    chat: `You are Claude. Solve problems step by step. Cite evidence using [n].`,
    write: `You are Gemini. Polish and write response concisely. Cite evidence [n].`,
    code: `You are Cursor. Generate working implementation code.`,
    image: `You are Midjourney. Provide detailed prompt specifications.`,
    video: `You are Kling AI. Generate detailed camera and motion prompts.`,
    voice: `You are ElevenLabs. Produce a natural voiceover script.`,
    paper: `You are Elicit. Provide academic evidence analysis.`
  };

  const payload = {
    messages: [
      { role: "system", content: modePrompts[state.currentMode] || "You are OMNI Beast." },
      { role: "user", content: question }
    ],
    context: { evidence, intent: state.currentMode }
  };

  try {
    const res = await fetch(`${state.workerUrl.replace(/\/$/, '')}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error(await res.text());

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let fullText = "";
    answerBox.textContent = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = dec.decode(value);
      chunk.split("\n").forEach(line => {
        if (line.startsWith("data:")) {
          const data = line.slice(5).trim();
          if (data && data !== "[DONE]") {
            try {
              const parsed = JSON.parse(data);
              if (parsed.delta) {
                fullText += parsed.delta;
                answerBox.textContent = fullText;
              }
            } catch (e) {}
          }
        }
      });
    }
  } catch (err) {
    answerBox.textContent = `❌ Worker Connection Failure: ${err.message}\n\nPlease check your Worker Endpoint under 'Settings'. Defaulting to local mode output.`;
  }
}

// === CAMERA & OCR ENGINE ===
async function startCamera() {
  try {
    state.cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    document.getElementById('cameraVideo').srcObject = state.cameraStream;
  } catch (e) {
    alert("Camera access denied or unavailable: " + e.message);
  }
}

function stopCamera() {
  if (state.cameraStream) {
    state.cameraStream.getTracks().forEach(t => t.stop());
    state.cameraStream = null;
    document.getElementById('cameraVideo').srcObject = null;
  }
}

async function runLocalOCR() {
  const fileInput = document.getElementById('ocrFile');
  const ocrText = document.getElementById('ocrText');
  
  if (!fileInput.files || fileInput.files.length === 0) {
    alert("Please select an image file first.");
    return;
  }

  ocrText.value = "Loading OCR Engine (Tesseract.js)...";

  if (!window.Tesseract) {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    document.head.appendChild(script);
    await new Promise(res => script.onload = res);
  }

  const result = await Tesseract.recognize(fileInput.files[0], 'eng', {
    logger: m => { if (m.status) ocrText.value = `${m.status}: ${Math.round((m.progress || 0) * 100)}%`; }
  });

  ocrText.value = result.data.text || "No text detected in image.";
}

// === EVENT HANDLERS & INITIALIZATION ===
document.getElementById('modes').onclick = e => {
  if (e.target.tagName === 'BUTTON') {
    state.currentMode = e.target.dataset.mode;
    updateActiveModeUI();
  }
};

document.getElementById('searchForm').onsubmit = async e => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) await runOmni(q);
};

document.getElementById('deepBtn').onclick = () => {
  state.deepMode = !state.deepMode;
  document.getElementById('deepBtn').classList.toggle('on', state.deepMode);
};

document.getElementById('aiBtn').onclick = () => {
  state.aiStreaming = !state.aiStreaming;
  document.getElementById('aiBtn').classList.toggle('on', state.aiStreaming);
};

document.getElementById('cameraBtn').onclick = () => openModal('cameraModal');
document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('workerUrlInput').value = state.workerUrl;
  openModal('settingsModal');
};

document.getElementById('saveSettingsBtn').onclick = () => {
  state.workerUrl = document.getElementById('workerUrlInput').value.trim();
  localStorage.setItem('omni_worker_url', state.workerUrl);
  closeModal('settingsModal');
};

document.getElementById('startCamBtn').onclick = startCamera;
document.getElementById('stopCamBtn').onclick = stopCamera;
document.getElementById('ocrBtn').onclick = runLocalOCR;

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { 
  if (id === 'cameraModal') stopCamera();
  document.getElementById(id).classList.remove('open'); 
}

// Initial Boot
renderTools();
</script>
</body>
</html>
