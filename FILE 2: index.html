<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omni AI Beast</title>
<meta name="theme-color" content="#080b10">
<style>
:root {
  --bg: #080b10;
  --panel: #12171f;
  --panel2: #1a212c;
  --line: #2a3444;
  --text: #e8eaed;
  --dim: #8b95a5;
  --amber: #f0b429;
  --teal: #4ecdc4;
  --user: #1a3a5c;
  --ai: #151c27;
}
[data-theme="light"] {
  --bg: #f0f2f5;
  --panel: #ffffff;
  --panel2: #e8ecf1;
  --line: #d0d7e2;
  --text: #1a1f2a;
  --dim: #5a6a7e;
  --amber: #d4920a;
  --teal: #0f766e;
  --user: #dbeafe;
  --ai: #f1f5f9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  transition: background .25s, color .25s;
}
.header {
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.logo {
  font-size: 1.25rem;
  font-weight: 750;
  background: linear-gradient(135deg, #fff 25%, var(--amber));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
[data-theme="light"] .logo {
  background: linear-gradient(135deg, #111 20%, var(--amber));
  -webkit-background-clip: text;
}
.header-btns { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  border-radius: 9px;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
}
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-overflow-scrolling: touch;
}
.msg {
  max-width: 920px;
  width: 100%;
  margin: 0 auto;
  padding: 13px 16px;
  border-radius: 14px;
  line-height: 1.55;
  font-size: 0.97rem;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user {
  background: var(--user);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
  max-width: 85%;
}
.msg.ai {
  background: var(--ai);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
}
.msg.system {
  text-align: center;
  color: var(--dim);
  font-size: 0.88rem;
  background: transparent;
  border: none;
}
.msg a { color: var(--teal); }
.input-area {
  padding: 12px 12px 20px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.input-wrap {
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
#input {
  flex: 1;
  padding: 13px 15px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  font-size: 1rem;
  outline: none;
  resize: none;
  min-height: 48px;
  max-height: 160px;
  line-height: 1.4;
}
#input:focus { border-color: var(--amber); }
.send-btn {
  width: 48px; height: 48px;
  border: none;
  border-radius: 14px;
  background: var(--amber);
  color: #111;
  font-size: 1.25rem;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.typing {
  display: inline-flex;
  gap: 5px;
  padding: 2px 0;
}
.typing i {
  width: 6px; height: 6px;
  background: var(--dim);
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-5px); }
}
@media (max-width: 600px) {
  .msg.user { max-width: 92%; }
}
</style>
</head>
<body>
  <div class="header">
    <div class="logo">Omni AI Beast</div>
    <div class="header-btns">
      <button class="icon-btn" onclick="clearChat()" title="Clear chat">🗑</button>
      <button class="icon-btn" onclick="toggleTheme()" title="Theme">◐</button>
    </div>
  </div>

  <div id="chat">
    <div class="msg system">Omni AI Beast online.<br>I can search the web, check weather, crypto, calculate, and answer almost anything.</div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" placeholder="Ask me anything..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">→</button>
    </div>
  </div>

<script>
// ===================================================
// PASTE YOUR CLOUDFLARE WORKER URL HERE
const WORKER_URL = "YOUR_WORKER_URL";
// ===================================================

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

let history = [];
let busy = false;

function toggleTheme() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", isLight ? "" : "light");
  localStorage.setItem("omni-theme", isLight ? "dark" : "light");
}
if (localStorage.getItem("omni-theme") === "light") {
  document.documentElement.setAttribute("data-theme", "light");
}

function clearChat() {
  history = [];
  chatEl.innerHTML = `<div class="msg system">Chat cleared. Ready.</div>`;
}

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});

inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  addMsg(text, "user");
  history.push({ role: "user", content: text });
  inputEl.value = "";
  inputEl.style.height = "auto";

  busy = true;
  sendBtn.disabled = true;

  const aiDiv = addMsg("", "ai");
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<i></i><i></i><i></i>";
  aiDiv.appendChild(typing);

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        history: history.slice(0, -1)
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Request failed");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    typing.remove();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      full += chunk;
      aiDiv.textContent = full;
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    aiDiv.innerHTML = full
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/(https?:\/\/[^\s\)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

    history.push({ role: "assistant", content: full });

  } catch (err) {
    typing.remove();
    aiDiv.textContent = "Error: " + err.message;
  }

  busy = false;
  sendBtn.disabled = false;
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMsg(text, role) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}
</script>
</body>
</html>
